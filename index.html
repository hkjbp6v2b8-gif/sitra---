<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سترة | SUTRA Abaya & Scarf Boutique</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0b0b;
            color: #f3f4f6;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-bg {
            background: linear-gradient(135deg, #bf953f 0%, #aa771c 100%);
        }
    </style>
</head>
<body class="bg-[#0b0b0b] text-gray-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- شريط الإعلانات العُلوي -->
    <div class="bg-[#141414] border-b border-amber-900/40 text-amber-300 text-xs py-2 px-4 text-center font-medium tracking-wide flex justify-between items-center max-w-7xl mx-auto w-full">
        <span class="flex-grow text-center">✨ شحن مجاني للطلبات التي تتجاوز 500 د.ل | كود الخصم: <span class="font-bold underline">SUTRA10</span> ✨</span>
        <button onclick="promptAdminLogin()" id="admin-toggle-btn" class="text-neutral-500 hover:text-amber-400 text-[11px] px-2 py-0.5 rounded border border-neutral-800">
            <i class="fa-solid fa-lock"></i> دخول الإدارة
        </button>
    </div>

    <!-- الشريط التنظيمي (Navbar) -->
    <header class="sticky top-0 z-40 bg-[#0b0b0b]/90 backdrop-blur-md border-b border-neutral-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full gold-bg flex items-center justify-center text-black font-black text-xl shadow-lg">س</div>
                <div>
                    <h1 class="text-xl font-black tracking-wider gold-gradient">سترة | SUTRA</h1>
                    <p class="text-[10px] tracking-widest text-neutral-400 uppercase">Abaya & Scarf Boutique</p>
                </div>
            </div>

            <!-- شريط البحث السريع والتحكم -->
            <div class="hidden md:flex items-center flex-grow max-w-xs mx-6">
                <div class="relative w-full">
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="ابحثي عن عباية، وشاح..." class="w-full bg-neutral-900 border border-neutral-800 rounded-full py-2 pr-9 pl-4 text-xs text-white focus:outline-none focus:border-amber-500">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-neutral-500 text-xs"></i>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button id="admin-add-btn" onclick="openAddModal()" class="hidden items-center gap-2 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/50 px-4 py-2 rounded-full text-xs font-semibold text-amber-300 transition shadow-md">
                    <i class="fa-solid fa-plus"></i> إضافة موديل
                </button>
                
                <button onclick="toggleWishlist()" class="relative p-2.5 rounded-full bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 hover:text-amber-400 transition">
                    <i class="fa-regular fa-heart text-lg"></i>
                    <span id="wishlist-badge" class="absolute -top-1 -right-1 bg-amber-500 text-black text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </button>
                <button onclick="toggleCart()" class="relative p-2.5 rounded-full bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 hover:text-amber-400 transition">
                    <i class="fa-solid fa-bag-shopping text-lg"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-amber-500 text-black text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>
