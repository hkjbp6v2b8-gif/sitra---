<!-- نافذة إدخال بيانات التوصيل قبل إتمام الطلب عبر الواتساب -->
<div id="checkout-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-[#141414] border border-neutral-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
        <button onclick="closeCheckoutModal()" class="absolute top-4 left-4 text-neutral-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
        <h3 class="text-lg font-bold text-amber-400 mb-2 flex items-center gap-2"><i class="fa-solid fa-truck-fast"></i> بيانات التوصيل</h3>
        <p class="text-xs text-neutral-400 mb-4">الرجاء إدخال بياناتك لتأكيد الطلب وإرساله عبر الواتساب:</p>
        
        <form onsubmit="submitOrderToWhatsApp(event)" class="space-y-4 text-sm">
            <div>
                <label class="block text-neutral-400 mb-1 text-xs">الاسم الكريم</label>
                <input type="text" id="client-name" required class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-3 text-white text-xs focus:outline-none focus:border-amber-500" placeholder="مثال: فاطمة أحمد">
            </div>
            <div>
                <label class="block text-neutral-400 mb-1 text-xs">رقم الهاتف (للتواصل أو الواتساب)</label>
                <input type="tel" id="client-phone" required class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-3 text-white text-xs focus:outline-none focus:border-amber-500" placeholder="مثال: 0912345678">
            </div>
            <div>
                <label class="block text-neutral-400 mb-1 text-xs">العنوان بالتفصيل (المدينة / المنطقة / الشارع)</label>
                <textarea id="client-address" rows="2" required class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-3 text-white text-xs focus:outline-none focus:border-amber-500" placeholder="مثال: طرابلس، زاوية الدهماني..."></textarea>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm mt-2">
                <i class="fa-brands fa-whatsapp text-lg"></i> إرسال الطلب الآن
            </button>
        </form>
    </div>
</div>
